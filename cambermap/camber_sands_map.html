<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camber Finder Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --primary: #ef4444; 
            --bg: #f8fafc; 
        }

        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body { 
            background-color: #cbd5e1; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0;
        }
        
        .map-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: auto; 
            cursor: grab; 
            user-select: none;
            background: #cbd5e1;
            scroll-behavior: smooth;
            z-index: 1;
        }
        .map-container:active { cursor: grabbing; }
        
        .map-wrapper { 
            position: relative; 
            transform-origin: 0 0; 
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1); 
            width: fit-content;
            height: fit-content;
        }
        #park-map { display: block; max-width: none; height: auto; }

        /* Spotlight Visuals */
        .spotlight-pin {
            position: absolute; width: 14px; height: 14px; transform: translate(-50%, -50%);
            border-radius: 50%; border: 2.5px solid white; background: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
            z-index: 100; pointer-events: none;
        }

        .spotlight-pulse {
            position: absolute; width: 100px; height: 100px; transform: translate(-50%, -50%);
            border: 4px solid #ef4444; border-radius: 50%;
            animation: spotlight-ping 2s infinite;
            pointer-events: none; z-index: 99;
        }
        @keyframes spotlight-ping {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; border-width: 8px; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; border-width: 1px; }
        }

        .spotlight-label {
            position: absolute; transform: translate(-50%, -100%); margin-top: -25px;
            background: #ef4444; color: white; padding: 6px 12px; border-radius: 8px;
            font-size: 16px; font-weight: 800; white-space: nowrap;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            z-index: 101; pointer-events: none;
        }

        /* Glass UI */
        .glass-ui {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        #toast {
            position: fixed; top: 1rem; left: 50%; transform: translate(-50%, -200%);
            padding: 0.75rem 1.5rem; background: #1e293b; color: white; border-radius: 99px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 2000; font-size: 0.875rem; font-weight: 600; width: max-content;
        }
        #toast.show { transform: translate(-50%, 0); }

        /* Search Bar Overlay */
        .search-container {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 2rem);
            max-width: 500px;
            z-index: 100;
        }

        .results-overlay {
            max-height: 50vh;
            overflow-y: auto;
            border-radius: 1.5rem;
            margin-top: 0.5rem;
        }

        /* Floating Actions */
        .floating-controls {
            position: fixed;
            right: 1rem;
            bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 50;
            transition: bottom 0.3s ease;
        }

        .floating-btn {
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #475569;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Bottom Info Sheet */
        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            z-index: 150;
            transition: bottom 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bottom-sheet.active {
            bottom: 0;
        }
    </style>
</head>
<body>

    <!-- Floating Search Bar -->
    <div class="search-container">
        <div class="glass-ui rounded-3xl p-2 flex items-center shadow-lg">
            <div class="w-10 h-10 bg-red-500 rounded-2xl flex items-center justify-center text-white shrink-0 ml-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
            <input type="text" id="searchInput" placeholder="Search house # or facility..." 
                class="bg-transparent border-none focus:ring-0 w-full px-4 font-bold text-slate-700 text-base" autocomplete="off">
            <button onclick="autoZoomToFit()" class="p-2 mr-1 text-slate-400 hover:text-red-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
            </button>
        </div>
        
        <!-- Search Results -->
        <div id="searchResults" class="results-overlay glass-ui hidden"></div>
    </div>

    <!-- Floating Controls -->
    <div class="floating-controls" id="floatingControls">
        <button onclick="zoomMap(1.4)" class="floating-btn glass-ui font-black">＋</button>
        <button onclick="zoomMap(0.7)" class="floating-btn glass-ui font-black">－</button>
    </div>

    <!-- Info Sheet -->
    <div id="selectionCard" class="bottom-sheet">
        <div class="mx-auto max-w-xl">
            <div class="glass-ui rounded-t-[2.5rem] p-6 pb-10 shadow-2xl relative">
                <!-- Pull Handle -->
                <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
                
                <div class="flex items-start justify-between">
                    <div>
                        <span id="cardCategory" class="text-[10px] font-black text-red-500 uppercase tracking-widest bg-red-50 px-2.5 py-1 rounded-full mb-2 inline-block">LOCATION</span>
                        <h2 id="cardTitle" class="text-4xl font-black text-slate-800 tracking-tighter leading-none">--</h2>
                    </div>
                    <button onclick="clearSelection()" class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>

                <div class="mt-8 grid grid-cols-2 gap-4">
                    <div class="bg-slate-50 p-4 rounded-3xl border border-slate-100">
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Status</p>
                        <p class="text-xs font-black text-slate-600">PINPOINT ACTIVE</p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-3xl border border-slate-100">
                        <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Database</p>
                        <p id="dbLabel" class="text-xs font-black text-slate-600 truncate">LOCAL SYNC</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Viewport -->
    <main class="map-container" id="container">
        <div class="map-wrapper" id="wrapper">
            <img src="cambersands.jpg" id="park-map" alt="Camber Sands Map">
            <div id="markerLayer"></div>
        </div>
    </main>

    <!-- Invisible Sync Input -->
    <input type="file" id="fileInput" class="hidden" accept=".json" onchange="handleManualUpload(event)">

    <div id="toast"></div>

    <script>
        let dynamicData = [];
        let selectedItem = null;
        let zoom = 1.0;
        let isDragging = false;
        let startX, startY, scrollLeft, scrollTop;

        const el = {
            container: document.getElementById('container'),
            wrapper: document.getElementById('wrapper'),
            markerLayer: document.getElementById('markerLayer'),
            searchInput: document.getElementById('searchInput'),
            searchResults: document.getElementById('searchResults'),
            parkMap: document.getElementById('park-map'),
            selectionCard: document.getElementById('selectionCard'),
            cardTitle: document.getElementById('cardTitle'),
            cardCategory: document.getElementById('cardCategory'),
            dbLabel: document.getElementById('dbLabel'),
            controls: document.getElementById('floatingControls'),
            toast: document.getElementById('toast')
        };

        window.onload = () => {
            initInteraction();
            attemptAutoSync();
            if (el.parkMap.complete) autoZoomToFit();
            else el.parkMap.onload = autoZoomToFit;
        };

        async function attemptAutoSync() {
            try {
                const response = await fetch('./camber_coords.json');
                if (!response.ok) throw new Error();
                const json = await response.json();
                processJsonData(json);
                el.dbLabel.innerText = "AUTO SYNCED";
                showToast("✓ Database loaded.");
            } catch (err) {
                el.dbLabel.innerText = "MANUAL SYNC REQ";
                showToast("Data file not found. Tap to sync.", 6000);
                el.dbLabel.parentElement.onclick = () => document.getElementById('fileInput').click();
            }
        }

        function handleManualUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    processJsonData(JSON.parse(e.target.result));
                    el.dbLabel.innerText = "MANUAL SYNCED";
                    showToast("✓ Sync successful.");
                } catch (err) { showToast("Error: Invalid JSON."); }
            };
            reader.readAsText(file);
        }

        function processJsonData(json) {
            dynamicData = Array.isArray(json) ? json : [...(json.caravans || []), ...(json.facilities || []), ...(json.all_locations || [])];
            // Deduplicate
            const seen = new Set();
            dynamicData = dynamicData.filter(i => {
                const k = (i.label || '') + i.normalized_x + i.normalized_y;
                return seen.has(k) ? false : seen.add(k);
            });
        }

        function autoZoomToFit() {
            const nw = el.parkMap.naturalWidth, nh = el.parkMap.naturalHeight;
            const cw = el.container.clientWidth, ch = el.container.clientHeight;
            if (!nw || !nh) return;
            const fitZoom = Math.min(cw / nw, ch / nh) * 0.95;
            zoomMapTo(fitZoom);
            el.container.scrollLeft = (nw * zoom - cw) / 2;
            el.container.scrollTop = (nh * zoom - ch) / 2;
        }

        function initInteraction() {
            // Drag handling
            el.container.onmousedown = (e) => {
                isDragging = true;
                startX = e.pageX - el.container.offsetLeft;
                startY = e.pageY - el.container.offsetTop;
                scrollLeft = el.container.scrollLeft;
                scrollTop = el.container.scrollTop;
            };
            window.onmouseup = () => isDragging = false;
            el.container.onmousemove = (e) => {
                if (!isDragging) return;
                el.container.scrollLeft = scrollLeft - (e.pageX - el.container.offsetLeft - startX);
                el.container.scrollTop = scrollTop - (e.pageY - el.container.offsetTop - startY);
            };

            // Touch support for dragging
            el.container.ontouchstart = (e) => {
                isDragging = true;
                startX = e.touches[0].pageX - el.container.offsetLeft;
                startY = e.touches[0].pageY - el.container.offsetTop;
                scrollLeft = el.container.scrollLeft;
                scrollTop = el.container.scrollTop;
            };
            el.container.ontouchend = () => isDragging = false;
            el.container.ontouchmove = (e) => {
                if (!isDragging) return;
                el.container.scrollLeft = scrollLeft - (e.touches[0].pageX - el.container.offsetLeft - startX);
                el.container.scrollTop = scrollTop - (e.touches[0].pageY - el.container.offsetTop - startY);
            };

            // Wheel zoom
            el.container.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    zoomMap(e.deltaY > 0 ? 0.8 : 1.25);
                }
            }, { passive: false });

            // Search
            el.searchInput.oninput = (e) => {
                const val = e.target.value.trim().toUpperCase();
                if (!val) { el.searchResults.classList.add('hidden'); return; }
                const matches = dynamicData.filter(i => {
                    const l = String(i.label).toUpperCase();
                    return l.includes(val) || (val.startsWith('M') && l.includes(val.substring(1)));
                }).slice(0, 10);
                
                el.searchResults.innerHTML = matches.map(m => `
                    <button onclick='spotlight(${JSON.stringify(m)})' class="w-full text-left p-5 flex justify-between items-center border-b border-slate-100 last:border-0 active:bg-slate-50">
                        <div>
                            <p class="font-black text-slate-800 text-lg">${m.label}</p>
                            <p class="text-[10px] font-bold text-slate-400 uppercase">${m.category || 'HOUSE'}</p>
                        </div>
                        <span class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                        </span>
                    </button>
                `).join('');
                el.searchResults.classList.toggle('hidden', matches.length === 0);
            };
        }

        function spotlight(item) {
            selectedItem = item;
            el.searchResults.classList.add('hidden');
            el.searchInput.value = '';
            el.searchInput.blur();
            
            el.cardTitle.innerText = item.label;
            el.cardCategory.innerText = (item.category || 'House').toUpperCase();
            el.selectionCard.classList.add('active');
            el.controls.style.bottom = '22rem'; // Move controls up

            refreshMarkers();
            zoomMapTo(0.7); // Mobile-optimized zoom context

            const nw = el.parkMap.naturalWidth, nh = el.parkMap.naturalHeight;
            setTimeout(() => {
                el.container.scrollTo({
                    left: (item.normalized_x * nw * zoom) - (el.container.clientWidth / 2),
                    top: (item.normalized_y * nh * zoom) - (el.container.clientHeight / 2),
                    behavior: 'smooth'
                });
            }, 100);
        }

        function refreshMarkers() {
            el.markerLayer.innerHTML = '';
            if (!selectedItem) return;

            const html = `
                <div class="spotlight-pin" style="left:${selectedItem.normalized_x*100}%; top:${selectedItem.normalized_y*100}%"></div>
                <div class="spotlight-pulse" style="left:${selectedItem.normalized_x*100}%; top:${selectedItem.normalized_y*100}%"></div>
                <div class="spotlight-label" style="left:${selectedItem.normalized_x*100}%; top:${selectedItem.normalized_y*100}%">${selectedItem.label}</div>
            `;
            el.markerLayer.innerHTML = html;
        }

        function zoomMap(factor) { zoomMapTo(Math.min(Math.max(0.05, zoom * factor), 10)); }

        function zoomMapTo(newZoom) {
            const oldZoom = zoom;
            zoom = newZoom;
            const centerX = el.container.scrollLeft + (el.container.clientWidth / 2);
            const centerY = el.container.scrollTop + (el.container.clientHeight / 2);
            el.wrapper.style.transform = `scale(${zoom})`;
            el.container.scrollLeft = (centerX * (zoom/oldZoom)) - (el.container.clientWidth / 2);
            el.container.scrollTop = (centerY * (zoom/oldZoom)) - (el.container.clientHeight / 2);
        }

        function clearSelection() {
            selectedItem = null;
            el.selectionCard.classList.remove('active');
            el.markerLayer.innerHTML = '';
            el.controls.style.bottom = '2rem';
        }

        function showToast(m, dur = 3500) {
            el.toast.innerText = m; el.toast.classList.add('show');
            setTimeout(() => el.toast.classList.remove('show'), dur);
        }
    </script>
</body>
</html>
