<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camber Pro - Spotlight Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --primary: #ef4444; 
            --bg: #f8fafc; 
        }

        body { 
            background-color: var(--bg); 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        
        .map-container {
            position: relative; 
            overflow: auto; 
            cursor: grab; 
            user-select: none;
            height: calc(100vh - 4rem); 
            background: #cbd5e1;
            scroll-behavior: smooth;
        }
        .map-container:active { cursor: grabbing; }
        
        .map-wrapper { 
            position: relative; 
            transform-origin: 0 0; 
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1); 
            width: fit-content;
            height: fit-content;
        }
        #park-map { display: block; max-width: none; height: auto; }

        /* Spotlight Visuals */
        .spotlight-pin {
            position: absolute; width: 14px; height: 14px; transform: translate(-50%, -50%);
            border-radius: 50%; border: 2.5px solid white; background: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
            z-index: 100; pointer-events: none;
        }

        .spotlight-pulse {
            position: absolute; width: 100px; height: 100px; transform: translate(-50%, -50%);
            border: 4px solid #ef4444; border-radius: 50%;
            animation: spotlight-ping 2s infinite;
            pointer-events: none; z-index: 99;
        }
        @keyframes spotlight-ping {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; border-width: 8px; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; border-width: 1px; }
        }

        .spotlight-label {
            position: absolute; transform: translate(-50%, -100%); margin-top: -25px;
            background: #ef4444; color: white; padding: 6px 12px; border-radius: 8px;
            font-size: 16px; font-weight: 800; white-space: nowrap;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            z-index: 101; pointer-events: none;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        #toast {
            position: fixed; bottom: 2rem; left: 50%; transform: translate(-50%, 200%);
            padding: 0.75rem 1.5rem; background: #1e293b; color: white; border-radius: 99px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            z-index: 1000; font-size: 0.875rem; font-weight: 600;
        }
        #toast.show { transform: translate(-50%, 0); }
    </style>
</head>
<body class="flex flex-col">

    <header class="h-16 bg-white border-b flex items-center justify-between px-6 z-40 shadow-sm">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-red-500 rounded-xl flex items-center justify-center shadow-lg">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
            <div>
                <h1 class="text-lg font-black text-slate-800 tracking-tight leading-none">Camber Finder</h1>
                <p id="db-status" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Attempting Auto-Sync...</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="autoZoomToFit()" class="text-[10px] font-black text-blue-600 bg-blue-50 px-4 py-2 rounded-full hover:bg-blue-100 transition-all mr-2 shadow-sm uppercase">Fit Whole Park</button>
            <div class="bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200 flex items-center gap-4">
                <button onclick="zoomMap(0.7)" class="text-slate-400 hover:text-blue-600 font-bold">－</button>
                <span id="zoom-label" class="text-[10px] font-black text-slate-600 min-w-[35px] text-center">100%</span>
                <button onclick="zoomMap(1.4)" class="text-slate-400 hover:text-blue-600 font-bold">＋</button>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <aside class="w-80 bg-white border-r flex flex-col z-30 shadow-2xl relative">
            <div class="p-5 space-y-6 flex-1 overflow-y-auto">
                
                <section id="searchSection" class="opacity-30 pointer-events-none transition-opacity duration-500">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">House Search</h3>
                    <div class="relative group">
                        <input type="text" id="searchInput" placeholder="Enter House # (e.g. M409)" 
                            class="w-full pl-10 pr-4 py-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-red-500 focus:bg-white outline-none transition-all text-sm font-bold shadow-sm">
                        <div class="absolute left-3.5 top-4 text-slate-400 group-focus-within:text-red-500">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </div>
                    </div>
                    <div id="searchResults" class="mt-4 space-y-2"></div>
                </section>

                <section id="selectionCard" class="hidden">
                    <div class="p-5 glass-card rounded-3xl border border-blue-100 shadow-xl shadow-blue-50/50">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-[9px] font-black text-red-500 uppercase tracking-widest" id="cardCategory">Location</span>
                            <button onclick="clearSelection()" class="text-slate-300 hover:text-slate-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                            </button>
                        </div>
                        <h2 id="cardTitle" class="text-3xl font-black text-slate-800 tracking-tighter mb-4">--</h2>
                        <div class="pt-4 border-t border-slate-100">
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">Pinpointed on map</p>
                        </div>
                    </div>
                </section>

                <!-- Sync Fallback / Manual Button -->
                <section class="pt-4 border-t border-slate-100">
                    <button onclick="document.getElementById('fileInput').click()" class="w-full flex items-center justify-center gap-2 py-3 bg-slate-100 text-slate-500 rounded-xl text-[10px] font-black hover:bg-slate-200 transition-all">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                        MANUAL JSON SYNC
                    </button>
                    <input type="file" id="fileInput" class="hidden" accept=".json" onchange="handleManualUpload(event)">
                </section>

                <div class="pt-2">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-tight mb-2">Hosting Info</p>
                    <p class="text-[10px] text-slate-400 leading-relaxed italic">
                        Place this file, <b>cambersands.jpg</b>, and <b>camber_coords.json</b> in the same folder (GitHub repo) for auto-loading.
                    </p>
                </div>
            </div>
            <div class="p-5 bg-slate-50 border-t border-slate-100">
                <span id="locations-count" class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">0 LOCATIONS LOADED</span>
            </div>
        </aside>

        <div class="flex-1 map-container" id="container">
            <div class="map-wrapper" id="wrapper">
                <!-- Using relative path for GitHub compatibility -->
                <img src="cambersands.jpg" id="park-map" alt="Park Map">
                <div id="markerLayer"></div>
            </div>
        </div>
    </main>

    <div id="toast"></div>

    <script>
        let dynamicData = [];
        let selectedItem = null;
        let zoom = 1.0;
        let isDragging = false;
        let startX, startY, scrollLeft, scrollTop;

        const el = {
            container: document.getElementById('container'),
            wrapper: document.getElementById('wrapper'),
            markerLayer: document.getElementById('markerLayer'),
            searchInput: document.getElementById('searchInput'),
            searchResults: document.getElementById('searchResults'),
            parkMap: document.getElementById('park-map'),
            selectionCard: document.getElementById('selectionCard'),
            cardTitle: document.getElementById('cardTitle'),
            cardCategory: document.getElementById('cardCategory'),
            dbStatus: document.getElementById('db-status'),
            searchSection: document.getElementById('searchSection'),
            countDisplay: document.getElementById('locations-count')
        };

        window.onload = () => {
            initInteraction();
            
            // 1. Start Auto-Sync
            attemptAutoSync();

            // 2. Setup Map image behavior
            if (el.parkMap.complete) autoZoomToFit();
            else el.parkMap.onload = autoZoomToFit;
        };

        /**
         * Automatically looks for 'camber_coords.json' in the same folder.
         * Works on local servers and GitHub Pages.
         */
        async function attemptAutoSync() {
            try {
                // We use './' to ensure it looks in the same directory relative to index.html
                const response = await fetch('./camber_coords.json');
                if (!response.ok) throw new Error("File not found");
                
                const json = await response.json();
                processJsonData(json);
                
                el.dbStatus.innerText = "Database Auto-Synced • Ready";
                el.dbStatus.className = "text-[10px] text-green-500 font-bold uppercase tracking-widest mt-1";
                showToast("✓ Database loaded automatically from server.");
            } catch (err) {
                console.warn("Auto-sync failed. Waiting for manual upload.", err);
                el.dbStatus.innerText = "Auto-Sync Failed • Manual Upload Required";
                el.dbStatus.className = "text-[10px] text-orange-500 font-bold uppercase tracking-widest mt-1";
            }
        }

        function handleManualUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const json = JSON.parse(e.target.result);
                    processJsonData(json);
                    el.dbStatus.innerText = "Manual Sync Complete • Ready";
                    el.dbStatus.className = "text-[10px] text-blue-500 font-bold uppercase tracking-widest mt-1";
                    showToast("✓ Manual sync successful.");
                } catch (err) {
                    showToast("Error: Invalid JSON format.");
                }
            };
            reader.readAsText(file);
        }

        function processJsonData(json) {
            // Support multiple formats: Array or Object with categories
            if (Array.isArray(json)) {
                dynamicData = json;
            } else if (json.caravans || json.facilities || json.all_locations) {
                dynamicData = [
                    ...(json.caravans || []),
                    ...(json.facilities || []),
                    ...(json.all_locations || [])
                ];
            } else {
                throw new Error("Format not recognized");
            }

            // Deduplicate
            const seen = new Set();
            dynamicData = dynamicData.filter(item => {
                const key = (item.label || '') + (item.normalized_x || 0) + (item.normalized_y || 0);
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });

            // Unlock UI
            el.searchSection.style.opacity = "1";
            el.searchSection.style.pointerEvents = "all";
            el.countDisplay.innerText = `${dynamicData.length} LOCATIONS LOADED`;
        }

        function autoZoomToFit() {
            const nw = el.parkMap.naturalWidth;
            const nh = el.parkMap.naturalHeight;
            const cw = el.container.clientWidth;
            const ch = el.container.clientHeight;
            if (!nw || !nh || !cw || !ch) return;

            const fitZoom = Math.min(cw / nw, ch / nh) * 0.98;
            zoomMapTo(fitZoom);
            el.container.scrollLeft = (nw * zoom - cw) / 2;
            el.container.scrollTop = (nh * zoom - ch) / 2;
        }

        function initInteraction() {
            el.container.onmousedown = (e) => {
                isDragging = true;
                startX = e.pageX - el.container.offsetLeft;
                startY = e.pageY - el.container.offsetTop;
                scrollLeft = el.container.scrollLeft;
                scrollTop = el.container.scrollTop;
            };
            window.onmouseup = () => isDragging = false;
            el.container.onmousemove = (e) => {
                if (!isDragging) return;
                el.container.scrollLeft = scrollLeft - (e.pageX - el.container.offsetLeft - startX);
                el.container.scrollTop = scrollTop - (e.pageY - el.container.offsetTop - startY);
            };

            el.container.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    zoomMap(e.deltaY > 0 ? 0.8 : 1.25);
                }
            }, { passive: false });

            el.searchInput.oninput = (e) => {
                const val = e.target.value.trim().toUpperCase();
                if (!val) { el.searchResults.innerHTML = ''; return; }
                
                const matches = dynamicData.filter(i => {
                    const label = String(i.label).toUpperCase();
                    return label.includes(val) || (val.startsWith('M') && label.includes(val.substring(1)));
                }).slice(0, 10);
                
                renderResults(matches);
            };
        }

        function renderResults(results) {
            el.searchResults.innerHTML = results.map(m => `
                <button onclick='spotlight(${JSON.stringify(m)})' class="w-full text-left p-4 bg-white border border-slate-100 rounded-2xl flex justify-between items-center transition-all shadow-sm hover:border-red-500 hover:shadow-md group">
                    <div>
                        <p class="font-black text-slate-800">${m.label}</p>
                        <p class="text-[9px] font-bold text-slate-300 uppercase mt-0.5">${m.category || 'LOCATION'}</p>
                    </div>
                    <span class="text-[10px] font-black text-red-500 opacity-0 group-hover:opacity-100 transition-opacity">SPOTLIGHT →</span>
                </button>
            `).join('') || '<div class="p-4 text-xs text-slate-400 italic">No building found.</div>';
        }

        function spotlight(item) {
            selectedItem = item;
            el.selectionCard.classList.remove('hidden');
            el.cardTitle.innerText = item.label;
            el.cardCategory.innerText = (item.category || 'House').toUpperCase();
            el.searchResults.innerHTML = '';
            el.searchInput.value = '';

            refreshMarkers();
            
            // Better context zoom level
            zoomMapTo(0.6);

            const nw = el.parkMap.naturalWidth || el.parkMap.width;
            const nh = el.parkMap.naturalHeight || el.parkMap.height;

            setTimeout(() => {
                el.container.scrollTo({
                    left: (item.normalized_x * nw * zoom) - (el.container.clientWidth / 2),
                    top: (item.normalized_y * nh * zoom) - (el.container.clientHeight / 2),
                    behavior: 'smooth'
                });
            }, 50);

            showToast(`Pinpointing ${item.label}`);
        }

        function refreshMarkers() {
            el.markerLayer.innerHTML = '';
            if (!selectedItem) return;

            const pin = document.createElement('div');
            pin.className = 'spotlight-pin';
            pin.style.left = `${selectedItem.normalized_x * 100}%`;
            pin.style.top = `${selectedItem.normalized_y * 100}%`;
            el.markerLayer.appendChild(pin);

            const pulse = document.createElement('div');
            pulse.className = 'spotlight-pulse';
            pulse.style.left = `${selectedItem.normalized_x * 100}%`;
            pulse.style.top = `${selectedItem.normalized_y * 100}%`;
            el.markerLayer.appendChild(pulse);

            const label = document.createElement('div');
            label.className = 'spotlight-label';
            label.style.left = `${selectedItem.normalized_x * 100}%`;
            label.style.top = `${selectedItem.normalized_y * 100}%`;
            label.innerText = selectedItem.label;
            el.markerLayer.appendChild(label);
        }

        function zoomMap(factor) { zoomMapTo(Math.min(Math.max(0.05, zoom * factor), 10)); }

        function zoomMapTo(newZoom) {
            const oldZoom = zoom;
            zoom = newZoom;
            const centerX = el.container.scrollLeft + (el.container.clientWidth / 2);
            const centerY = el.container.scrollTop + (el.container.clientHeight / 2);
            el.wrapper.style.transform = `scale(${zoom})`;
            document.getElementById('zoom-label').innerText = `${Math.round(zoom * 100)}%`;
            el.container.scrollLeft = (centerX * (zoom/oldZoom)) - (el.container.clientWidth / 2);
            el.container.scrollTop = (centerY * (zoom/oldZoom)) - (el.container.clientHeight / 2);
        }

        function clearSelection() {
            selectedItem = null;
            el.selectionCard.classList.add('hidden');
            el.markerLayer.innerHTML = '';
        }

        function showToast(m) {
            const t = document.getElementById('toast');
            t.innerText = m; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 4000);
        }
    </script>
</body>
</html>
