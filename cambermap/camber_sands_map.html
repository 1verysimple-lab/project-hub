<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Camber Finder Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --primary: #ef4444; 
            --bg: #f8fafc; 
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body { 
            background-color: #cbd5e1; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0;
            position: fixed;
            width: 100%;
        }
        
        /* Map Container - Touch action none to take full control of gestures */
        .map-viewport {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden; 
            background: #cbd5e1;
            z-index: 1;
            touch-action: none;
        }
        
        .map-wrapper { 
            position: absolute; 
            transform-origin: 0 0; 
            will-change: transform;
            width: fit-content;
            height: fit-content;
        }
        #park-map { 
            display: block; 
            max-width: none; 
            height: auto; 
            pointer-events: none; /* Let touches fall through to wrapper/viewport */
        }

        /* Spotlight Visuals */
        .spotlight-pin {
            position: absolute; width: 14px; height: 14px; transform: translate(-50%, -50%);
            border-radius: 50%; border: 2.5px solid white; background: #ef4444;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.8);
            z-index: 100; pointer-events: none;
        }

        .spotlight-pulse {
            position: absolute; width: 100px; height: 100px; transform: translate(-50%, -50%);
            border: 4px solid #ef4444; border-radius: 50%;
            animation: spotlight-ping 2s infinite;
            pointer-events: none; z-index: 99;
        }
        @keyframes spotlight-ping {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 1; border-width: 8px; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; border-width: 1px; }
        }

        .spotlight-label {
            position: absolute; transform: translate(-50%, -100%); margin-top: -25px;
            background: #ef4444; color: white; padding: 6px 12px; border-radius: 8px;
            font-size: 16px; font-weight: 800; white-space: nowrap;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            z-index: 101; pointer-events: none;
        }

        /* Glass UI Components */
        .glass-ui {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }

        /* Search Interface */
        .search-container {
            position: fixed;
            top: env(safe-area-inset-top, 1rem);
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 1.5rem);
            max-width: 450px;
            z-index: 200;
        }

        .results-overlay {
            max-height: 60vh;
            overflow-y: auto;
            border-radius: 1.5rem;
            margin-top: 0.5rem;
        }

        /* Floating Controls */
        .floating-controls {
            position: fixed;
            right: 1rem;
            bottom: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .floating-btn {
            width: 3.25rem;
            height: 3.25rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: #475569;
        }

        /* Bottom Info Sheet */
        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            right: 0;
            z-index: 300;
            transition: bottom 0.4s cubic-bezier(0.1, 0.7, 0.1, 1);
        }
        .bottom-sheet.active {
            bottom: 0;
        }

        #toast {
            position: fixed; top: 5rem; left: 50%; transform: translate(-50%, -200%);
            padding: 0.6rem 1.25rem; background: #1e293b; color: white; border-radius: 99px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.2);
            transition: transform 0.5s ease; 
            z-index: 2000; font-size: 0.8rem; font-weight: 600; width: max-content;
        }
        #toast.show { transform: translate(-50%, 0); }
    </style>
</head>
<body>

    <!-- Search Bar -->
    <div class="search-container">
        <div class="glass-ui rounded-[1.75rem] p-1.5 flex items-center">
            <div class="w-10 h-10 bg-red-500 rounded-2xl flex items-center justify-center text-white shrink-0 ml-1">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
            <input type="text" id="searchInput" placeholder="Search house #..." 
                class="bg-transparent border-none focus:ring-0 w-full px-4 font-bold text-slate-700 text-base" autocomplete="off">
            <button onclick="autoZoomToFit()" class="p-2 mr-1 text-slate-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
            </button>
        </div>
        <div id="searchResults" class="results-overlay glass-ui hidden"></div>
    </div>

    <!-- Zoom Controls (Still useful for one-hand precision) -->
    <div class="floating-controls" id="floatingControls">
        <button onclick="zoomMap(1.5)" class="floating-btn glass-ui font-black">＋</button>
        <button onclick="zoomMap(0.6)" class="floating-btn glass-ui font-black">－</button>
    </div>

    <!-- Info Sheet -->
    <div id="selectionCard" class="bottom-sheet">
        <div class="mx-auto max-w-xl">
            <div class="glass-ui rounded-t-[2.5rem] p-6 pb-12 shadow-2xl">
                <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
                <div class="flex items-start justify-between">
                    <div>
                        <span id="cardCategory" class="text-[10px] font-black text-red-500 uppercase tracking-widest bg-red-50 px-2.5 py-1 rounded-full mb-2 inline-block">CARAVAN</span>
                        <h2 id="cardTitle" class="text-4xl font-black text-slate-800 tracking-tighter leading-none">--</h2>
                    </div>
                    <button onclick="clearSelection()" class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="mt-6 p-4 bg-slate-50 rounded-3xl border border-slate-100">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Status</p>
                    <p class="text-xs font-black text-slate-600">PINPOINT ACTIVE • Center map to find</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Viewport -->
    <main class="map-viewport" id="viewport">
        <div class="map-wrapper" id="wrapper">
            <img src="cambersands.jpg" id="park-map" alt="Camber Sands Map">
            <div id="markerLayer"></div>
        </div>
    </main>

    <input type="file" id="fileInput" class="hidden" accept=".json" onchange="handleManualUpload(event)">
    <div id="toast"></div>

    <script>
        let dynamicData = [];
        let selectedItem = null;
        
        // Transform State
        let scale = 1.0;
        let translateX = 0;
        let translateY = 0;
        
        // Gesture State
        let lastTouchX = 0;
        let lastTouchY = 0;
        let initialDistance = 0;
        let initialScale = 1.0;
        let isGesturing = false;

        const el = {
            viewport: document.getElementById('viewport'),
            wrapper: document.getElementById('wrapper'),
            markerLayer: document.getElementById('markerLayer'),
            searchInput: document.getElementById('searchInput'),
            searchResults: document.getElementById('searchResults'),
            parkMap: document.getElementById('park-map'),
            selectionCard: document.getElementById('selectionCard'),
            cardTitle: document.getElementById('cardTitle'),
            cardCategory: document.getElementById('cardCategory'),
            controls: document.getElementById('floatingControls'),
            toast: document.getElementById('toast')
        };

        window.onload = () => {
            setupGestures();
            attemptAutoSync();
            
            if (el.parkMap.complete) autoZoomToFit();
            else el.parkMap.onload = autoZoomToFit;
        };

        async function attemptAutoSync() {
            try {
                const response = await fetch('./camber_coords.json');
                if (!response.ok) throw new Error();
                const json = await response.json();
                processJsonData(json);
                showToast("✓ Map data synced.");
            } catch (err) {
                showToast("JSON not found. Tap to sync manually.", 5000);
                el.searchInput.onclick = () => {
                    if (dynamicData.length === 0) document.getElementById('fileInput').click();
                };
            }
        }

        function processJsonData(json) {
            dynamicData = Array.isArray(json) ? json : [...(json.caravans || []), ...(json.facilities || []), ...(json.all_locations || [])];
            const seen = new Set();
            dynamicData = dynamicData.filter(i => {
                const k = (i.label || '') + i.normalized_x + i.normalized_y;
                return seen.has(k) ? false : seen.add(k);
            });
        }

        function applyTransform() {
            el.wrapper.style.transform = `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;
        }

        function autoZoomToFit() {
            const nw = el.parkMap.naturalWidth, nh = el.parkMap.naturalHeight;
            const vw = el.viewport.clientWidth, vh = el.viewport.clientHeight;
            if (!nw || !nh) return;

            scale = Math.min(vw / nw, vh / nh);
            translateX = (vw - nw * scale) / 2;
            translateY = (vh - nh * scale) / 2;
            applyTransform();
        }

        function setupGestures() {
            // Mouse Drag (Desktop Support)
            let isMouseDown = false;
            el.viewport.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                lastTouchX = e.clientX;
                lastTouchY = e.clientY;
            });
            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                translateX += e.clientX - lastTouchX;
                translateY += e.clientY - lastTouchY;
                lastTouchX = e.clientX;
                lastTouchY = e.clientY;
                applyTransform();
            });
            window.addEventListener('mouseup', () => isMouseDown = false);

            // Touch Gestures (Pinch & Pan)
            el.viewport.addEventListener('touchstart', (e) => {
                isGesturing = true;
                if (e.touches.length === 2) {
                    initialDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    initialScale = scale;
                } else if (e.touches.length === 1) {
                    lastTouchX = e.touches[0].pageX;
                    lastTouchY = e.touches[0].pageY;
                }
            }, { passive: false });

            el.viewport.addEventListener('touchmove', (e) => {
                if (!isGesturing) return;
                e.preventDefault();

                if (e.touches.length === 2) {
                    // Handle Pinch
                    const currentDistance = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    const touchScale = currentDistance / initialDistance;
                    const newScale = Math.min(Math.max(initialScale * touchScale, 0.05), 10);
                    
                    // Zoom towards the midpoint of the fingers
                    const midX = (e.touches[0].pageX + e.touches[1].pageX) / 2;
                    const midY = (e.touches[0].pageY + e.touches[1].pageY) / 2;
                    
                    const mouseX = (midX - translateX) / scale;
                    const mouseY = (midY - translateY) / scale;
                    
                    scale = newScale;
                    translateX = midX - mouseX * scale;
                    translateY = midY - mouseY * scale;

                } else if (e.touches.length === 1) {
                    // Handle Pan
                    translateX += e.touches[0].pageX - lastTouchX;
                    translateY += e.touches[0].pageY - lastTouchY;
                    lastTouchX = e.touches[0].pageX;
                    lastTouchY = e.touches[0].pageY;
                }
                applyTransform();
            }, { passive: false });

            el.viewport.addEventListener('touchend', () => isGesturing = false);

            // Wheel zoom
            el.viewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const factor = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = Math.min(Math.max(scale * factor, 0.05), 10);
                
                const mouseX = (e.clientX - translateX) / scale;
                const mouseY = (e.clientY - translateY) / scale;
                
                scale = newScale;
                translateX = e.clientX - mouseX * scale;
                translateY = e.clientY - mouseY * scale;
                applyTransform();
            }, { passive: false });

            // Search Logic
            el.searchInput.oninput = (e) => {
                const val = e.target.value.trim().toUpperCase();
                if (!val) { el.searchResults.classList.add('hidden'); return; }
                const matches = dynamicData.filter(i => {
                    const l = String(i.label).toUpperCase();
                    return l.includes(val) || (val.startsWith('M') && l.includes(val.substring(1)));
                }).slice(0, 10);
                
                el.searchResults.innerHTML = matches.map(m => `
                    <button onclick='spotlight(${JSON.stringify(m)})' class="w-full text-left p-5 flex justify-between items-center border-b border-slate-100 last:border-0 active:bg-slate-50">
                        <div>
                            <p class="font-black text-slate-800 text-lg">${m.label}</p>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${m.category || 'HOUSE'}</p>
                        </div>
                        <span class="w-8 h-8 rounded-full bg-red-50 text-red-500 flex items-center justify-center">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                        </span>
                    </button>
                `).join('');
                el.searchResults.classList.toggle('hidden', matches.length === 0);
            };
        }

        function spotlight(item) {
            selectedItem = item;
            el.searchResults.classList.add('hidden');
            el.searchInput.value = '';
            el.searchInput.blur();
            
            el.cardTitle.innerText = item.label;
            el.cardCategory.innerText = (item.category || 'House').toUpperCase();
            el.selectionCard.classList.add('active');
            el.controls.style.transform = 'translateY(-18rem)';

            refreshMarkers();
            
            // Set scale for spotlight
            scale = 0.7; 
            const vw = el.viewport.clientWidth, vh = el.viewport.clientHeight;
            const nw = el.parkMap.naturalWidth, nh = el.parkMap.naturalHeight;
            
            translateX = (vw / 2) - (item.normalized_x * nw * scale);
            translateY = (vh / 2.5) - (item.normalized_y * nh * scale); // Position target slightly above center for bottom sheet
            
            applyTransform();
        }

        function zoomMap(factor) {
            const newScale = Math.min(Math.max(scale * factor, 0.05), 10);
            const vw = el.viewport.clientWidth, vh = el.viewport.clientHeight;
            
            // Zoom to center of screen
            const mouseX = (vw / 2 - translateX) / scale;
            const mouseY = (vh / 2 - translateY) / scale;
            
            scale = newScale;
            translateX = vw / 2 - mouseX * scale;
            translateY = vh / 2 - mouseY * scale;
            applyTransform();
        }

        function refreshMarkers() {
            el.markerLayer.innerHTML = '';
            if (!selectedItem) return;
            const html = `
                <div class="spotlight-pin" style="left:${selectedItem.normalized_x*100}%; top:${selectedItem.normalized_y*100}%"></div>
                <div class="spotlight-pulse" style="left:${selectedItem.normalized_x*100}%; top:${selectedItem.normalized_y*100}%"></div>
                <div class="spotlight-label" style="left:${selectedItem.normalized_x*100}%; top:${selectedItem.normalized_y*100}%">${selectedItem.label}</div>
            `;
            el.markerLayer.innerHTML = html;
        }

        function clearSelection() {
            selectedItem = null;
            el.selectionCard.classList.remove('active');
            el.markerLayer.innerHTML = '';
            el.controls.style.transform = 'translateY(0)';
        }

        function handleManualUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    processJsonData(JSON.parse(e.target.result));
                    showToast("✓ Database Loaded.");
                } catch (err) { showToast("Error: Invalid JSON."); }
            };
            reader.readAsText(file);
        }

        function showToast(m, dur = 3500) {
            el.toast.innerText = m; el.toast.classList.add('show');
            setTimeout(() => el.toast.classList.remove('show'), dur);
        }
    </script>
</body>
</html>
