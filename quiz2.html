<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuizRun: Streak Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            touch-action: manipulation;
            overscroll-behavior: none;
            height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .player-token {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            z-index: 20;
        }

        .tile { position: relative; transition: all 0.3s ease; }
        .tile::after { content: ''; position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 12px rgba(0,0,0,0.2); pointer-events: none; }

        /* Custom Gradients */
        .token-p1 { background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb); }
        .token-p2 { background: radial-gradient(circle at 30% 30%, #f472b6, #db2777); }

        .safe-pb { padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
        .btn-press:active { transform: scale(0.96) translateY(1px); }
    </style>
</head>
<body class="selection:bg-indigo-500 selection:text-white">

    <header class="glass p-4 z-20 shrink-0 flex justify-between items-center border-b-0 shadow-lg">
        <div class="flex items-center gap-3">
            <div>
                <h1 class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-pink-400">QuizRun</h1>
                <div class="text-[10px] text-slate-400 font-medium tracking-widest uppercase">Streak Mode</div>
            </div>
            <button id="open-import-btn" class="bg-slate-700/50 hover:bg-slate-600 p-2 rounded-lg border border-slate-600 text-slate-300 transition-colors" title="Import Questions">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
            </button>
        </div>
        
        <div class="flex gap-2">
            <div id="p1-badge" class="flex flex-col items-center p-2 rounded-xl bg-slate-800/50 border border-slate-700 transition-all w-20">
                <div class="flex items-center gap-1 mb-1">
                    <div class="w-2 h-2 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.5)]"></div>
                    <span class="text-[10px] font-bold text-slate-300">BLUES</span>
                </div>
                <div class="flex gap-2 text-[10px]">
                    <span id="p1-helps" class="text-blue-400 font-mono">2⚡</span>
                </div>
            </div>
            <div id="p2-badge" class="flex flex-col items-center p-2 rounded-xl bg-slate-800/50 border border-slate-700 transition-all w-20 opacity-50">
                <div class="flex items-center gap-1 mb-1">
                    <div class="w-2 h-2 rounded-full bg-pink-500 shadow-[0_0_8px_rgba(236,72,153,0.5)]"></div>
                    <span class="text-[10px] font-bold text-slate-300">BIANCA</span>
                </div>
                <div class="flex gap-2 text-[10px]">
                    <span id="p2-helps" class="text-pink-400 font-mono">5⚡</span>
                    <span id="p2-vetos" class="text-emerald-400 font-mono">3🚫</span>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden flex flex-col justify-center bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
        <div class="absolute inset-0 bg-gradient-to-b from-slate-900/0 via-slate-900/50 to-slate-900/80 pointer-events-none"></div>
        <div id="board-container" class="relative z-10 w-full max-w-md mx-auto px-4 h-full overflow-y-auto no-scrollbar py-8">
            <div id="game-board" class="grid grid-cols-5 gap-3 pb-32"></div>
        </div>
    </main>

    <footer class="glass border-t-0 p-4 shrink-0 z-30 safe-pb shadow-[0_-10px_40px_rgba(0,0,0,0.3)]">
        <div class="max-w-md mx-auto">
            <div id="status-bar" class="flex justify-between items-end mb-3 px-1">
                <span id="turn-indicator" class="text-sm font-bold text-blue-400 uppercase tracking-wider">Blues' Turn</span>
            </div>
            
            <button id="action-btn" class="w-full relative group btn-press overflow-hidden rounded-2xl p-[1px]">
                <div id="action-btn-bg" class="absolute inset-0 bg-gradient-to-r from-blue-600 to-indigo-600 transition-all"></div>
                <div class="relative bg-slate-900 rounded-2xl px-6 py-4 flex items-center justify-center group-hover:bg-slate-800/90 transition-all">
                    <span class="font-bold text-lg text-white tracking-wide">UNLOCK QUESTION</span>
                </div>
            </button>
        </div>
    </footer>

    <div id="import-modal" class="fixed inset-0 bg-slate-950/90 z-[80] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="w-full max-w-lg glass-card rounded-2xl p-6 flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-white">Import Custom Questions</h3>
                <button id="close-import-btn" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <div class="mb-4 text-sm font-mono text-blue-300 bg-slate-800/80 p-3 rounded-lg border border-slate-700 flex justify-between">
                <span>Current Questions in Pool:</span>
                <span id="db-counter" class="font-bold text-white text-lg">0</span>
            </div>
            
            <textarea id="import-area" class="w-full h-40 bg-slate-800 border border-slate-600 rounded-lg p-3 text-xs font-mono text-white focus:border-blue-500 outline-none resize-none mb-4" placeholder='[{"q":"Question?","o":["A","B","C","D"],"a":0}]'></textarea>
            <button id="load-questions-btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-colors">Load Data</button>
            <div id="import-status" class="text-center text-xs font-bold mt-3 h-4"></div>
        </div>
    </div>

    <div id="modal-overlay" class="fixed inset-0 bg-slate-950/80 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 backdrop-blur-sm transition-all duration-300">
        <div id="modal-card" class="w-full sm:max-w-md glass-card rounded-t-3xl sm:rounded-3xl overflow-hidden flex flex-col max-h-[85vh] animate-[float_0.5s_ease-out]">
            <div class="relative h-2 bg-gradient-to-r from-blue-500 to-pink-500 shrink-0"></div>
            <div class="px-6 pt-6 pb-2 flex justify-between items-center">
                <span id="q-category" class="text-[10px] font-black uppercase tracking-[0.2em] text-blue-300 bg-blue-500/10 px-3 py-1.5 rounded-full border border-blue-500/20">CATEGORY</span>
                <div class="flex gap-2">
                    <button id="veto-btn" class="hidden text-[10px] font-bold text-emerald-300 bg-emerald-500/20 px-3 py-1.5 rounded-full border border-emerald-500/30 hover:bg-emerald-500/30 transition-colors btn-press flex items-center gap-1">🚫 SKIP</button>
                    <button id="lifeline-btn" class="text-[10px] font-bold text-purple-300 bg-purple-500/20 px-3 py-1.5 rounded-full border border-purple-500/30 hover:bg-purple-500/30 transition-colors btn-press flex items-center gap-1">⚡ 50/50</button>
                </div>
            </div>
            <div class="p-6 overflow-y-auto custom-scrollbar">
                <h3 id="q-text" class="text-xl font-bold text-white leading-relaxed mb-8 drop-shadow-md">Question text?</h3>
                <div id="q-options" class="space-y-3"></div>
            </div>
            <div id="feedback-bar" class="hidden p-4 text-center font-bold text-sm tracking-wide shrink-0"></div>
        </div>
    </div>

    <div id="win-screen" class="fixed inset-0 z-[70] hidden flex flex-col items-center justify-center bg-slate-950 p-8 text-center">
        <div class="text-8xl mb-6 animate-bounce">👑</div>
        <h2 id="winner-name" class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 mb-4">Winner!</h2>
        <button onclick="location.reload()" class="bg-white text-slate-900 px-10 py-4 rounded-full font-bold text-lg hover:scale-105 transition-transform shadow-[0_0_20px_rgba(255,255,255,0.3)]">Play Again</button>
    </div>

    <script>
        // --- Config ---
        const BOARD_SIZE = 50; 
        
        const PLAYERS = [
            { id: 0, name: "Blues", color: "token-p1", ring: "border-blue-500", pos: 0, helps: 2, vetos: 0 },
            { id: 1, name: "Bianca", color: "token-p2", ring: "border-pink-500", pos: 0, helps: 5, vetos: 3 }
        ];

        let turnIdx = 0;
        let activeQuestion = null;
        
        const CATEGORIES = ["Modern Tech", "Classic Era", "Science", "Pop Culture", "Deep Tech", "History", "Arts", "CUSTOM"];

        // --- DATABASE ---
        let DB = [
            {i:1, c:0, q:"Most liked Instagram photo?", o:["Egg", "Messi", "Kylie", "Ronaldo"], a:1},
            {i:2, c:0, q:"'Barbenheimer' referred to Barbie and...?", o:["Oppenheimer", "Dune", "Mission Impossible", "Mario"], a:0},
            {i:3, c:0, q:"Creator of 'Renegade' dance?", o:["Jalaiah Harmon", "Charli D'Amelio", "Addison Rae", "Bella Poarch"], a:0},
            {i:4, c:0, q:"Oxford's 2023 Word of the Year?", o:["Rizz", "Goblin mode", "Metaverse", "Swiftie"], a:0},
            {i:101, c:0, q:"Platform for 'doomscrolling'?", o:["Twitter/X", "TikTok", "Reddit", "Facebook"], a:0},
            {i:102, c:0, q:"Vision Pro headset maker?", o:["Apple", "Meta", "Sony", "Microsoft"], a:0},
            {i:103, c:0, q:"'NPC' slang meaning?", o:["Non-Playable Character", "No Personality Core", "New Player Chat", "Nice Person Club"], a:0}
        ];

        // --- HELPER: Update Counter ---
        function updateDBCounter() {
            const el = document.getElementById('db-counter');
            if (el) el.innerText = DB.length;
        }

        function initGame() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            
            // Render Tiles
            for (let i = 0; i < BOARD_SIZE; i++) {
                const tile = document.createElement('div');
                tile.className = `tile glass aspect-square rounded-xl flex items-center justify-center text-xs font-bold text-slate-500 border border-slate-700/50`;
                tile.innerText = i + 1;
                tile.id = `tile-${i}`;
                board.appendChild(tile);
            }
            
            renderPlayers();
            updateStatus();
            updateDBCounter(); 
        }

        function renderPlayers() {
            document.querySelectorAll('.player-token').forEach(e => e.remove());
            PLAYERS.forEach(p => {
                const tile = document.getElementById(`tile-${p.pos}`);
                if (tile) {
                    const token = document.createElement('div');
                    token.className = `player-token w-8 h-8 rounded-full border-2 ${p.ring} ${p.color} absolute shadow-lg`;
                    // Offset slightly if on same tile
                    const offset = PLAYERS.filter(pl => pl.pos === p.pos && pl.id < p.id).length * 5;
                    token.style.transform = `translate(${offset}px, ${offset}px)`;
                    tile.appendChild(token);
                }
            });
        }

        function updateStatus() {
            const p = PLAYERS[turnIdx];
            const ind = document.getElementById('turn-indicator');
            ind.innerText = `${p.name}'s Turn`;
            ind.className = turnIdx === 0 ? "text-sm font-bold text-blue-400 uppercase tracking-wider" : "text-sm font-bold text-pink-400 uppercase tracking-wider";
            
            document.getElementById('p1-badge').className = `flex flex-col items-center p-2 rounded-xl border transition-all w-20 ${turnIdx === 0 ? 'bg-slate-700 border-blue-500/50 opacity-100 scale-105' : 'bg-slate-800/50 border-slate-700 opacity-50'}`;
            document.getElementById('p2-badge').className = `flex flex-col items-center p-2 rounded-xl border transition-all w-20 ${turnIdx === 1 ? 'bg-slate-700 border-pink-500/50 opacity-100 scale-105' : 'bg-slate-800/50 border-slate-700 opacity-50'}`;
            
            // Update stats
            document.getElementById('p1-helps').innerText = `${PLAYERS[0].helps}⚡`;
            document.getElementById('p2-helps').innerText = `${PLAYERS[1].helps}⚡`;
            document.getElementById('p2-vetos').innerText = `${PLAYERS[1].vetos}🚫`;
        }

        // --- GAMEPLAY ---

        document.getElementById('action-btn').addEventListener('click', () => {
            const btn = document.getElementById('action-btn');
            btn.disabled = true;
            showQuestion();
        });

        function showQuestion() {
            if (DB.length === 0) {
                alert("Database empty! Please import questions.");
                return;
            }

            // 1. Pick a random index
            const randomIdx = Math.floor(Math.random() * DB.length);
            activeQuestion = DB[randomIdx];

            // 2. Remove from DB (No repeats)
            DB.splice(randomIdx, 1);
            updateDBCounter(); 

            // Render Question
            document.getElementById('modal-overlay').classList.remove('hidden');
            document.getElementById('q-category').innerText = CATEGORIES[activeQuestion.c] || "GENERAL";
            document.getElementById('q-text').innerText = activeQuestion.q;
            
            const optsDiv = document.getElementById('q-options');
            optsDiv.innerHTML = '';
            
            activeQuestion.o.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl bg-slate-800/50 hover:bg-blue-600/20 border border-slate-700 hover:border-blue-500 transition-all font-semibold text-slate-300 hover:text-white mb-2";
                btn.innerText = opt;
                btn.onclick = () => handleAnswer(idx, btn);
                optsDiv.appendChild(btn);
            });

            // Vetos/Lifelines UI
            const vetoBtn = document.getElementById('veto-btn');
            if (PLAYERS[turnIdx].vetos > 0) {
                vetoBtn.classList.remove('hidden');
                vetoBtn.onclick = useVeto;
            } else {
                vetoBtn.classList.add('hidden');
            }
            
            const lifeBtn = document.getElementById('lifeline-btn');
            lifeBtn.disabled = PLAYERS[turnIdx].helps <= 0;
            lifeBtn.style.opacity = PLAYERS[turnIdx].helps <= 0 ? 0.5 : 1;
            lifeBtn.onclick = useLifeline;
        }

        function handleAnswer(idx, btn) {
            const isCorrect = idx === activeQuestion.a;
            const allBtns = document.getElementById('q-options').children;
            
            Array.from(allBtns).forEach(b => b.disabled = true);
            
            if (isCorrect) {
                // Correct: Move +1 AND CONTINUE TURN
                btn.classList.add('bg-emerald-500', 'border-emerald-400', 'text-white');
                showFeedback("CORRECT! GO AGAIN!", "text-emerald-400");
                
                const p = PLAYERS[turnIdx];
                p.pos = Math.min(BOARD_SIZE - 1, p.pos + 1);
                renderPlayers();

                setTimeout(() => {
                    if (p.pos === BOARD_SIZE - 1) {
                        closeModal();
                        triggerWin(p);
                    } else {
                        closeModal();
                        // CRITICAL: Re-enable button but DO NOT switch turn
                        document.getElementById('action-btn').disabled = false;
                    }
                }, 1500);

            } else {
                // Wrong: No Move AND END TURN
                btn.classList.add('bg-red-500', 'border-red-400', 'text-white');
                allBtns[activeQuestion.a].classList.add('bg-emerald-500/50', 'border-emerald-400/50');
                showFeedback("WRONG! TURN OVER", "text-red-400");
                
                setTimeout(() => {
                    closeModal();
                    endTurn(); // Switch players only on failure
                }, 2000);
            }
        }

        function showFeedback(msg, colorClass) {
            const bar = document.getElementById('feedback-bar');
            bar.innerText = msg;
            bar.className = `p-4 text-center font-bold text-xl tracking-wide shrink-0 ${colorClass}`;
            bar.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('feedback-bar').classList.add('hidden');
        }

        function endTurn() {
            document.getElementById('action-btn').disabled = false;
            turnIdx = (turnIdx + 1) % 2;
            updateStatus();
        }

        function triggerWin(p) {
            document.getElementById('win-screen').classList.remove('hidden');
            document.getElementById('winner-name').innerText = `${p.name} Wins!`;
        }

        // --- BONUSES ---
        function useVeto() {
            if (PLAYERS[turnIdx].vetos > 0) {
                PLAYERS[turnIdx].vetos--;
                updateStatus();
                closeModal();
                endTurn(); // Veto ends turn in this mode
            }
        }

        function useLifeline() {
            if (PLAYERS[turnIdx].helps > 0) {
                PLAYERS[turnIdx].helps--;
                updateStatus();
                // Remove 2 wrong answers
                const opts = Array.from(document.getElementById('q-options').children);
                const correct = activeQuestion.a;
                let removed = 0;
                opts.forEach((btn, idx) => {
                    if (idx !== correct && removed < 2) {
                        btn.style.visibility = 'hidden';
                        removed++;
                    }
                });
            }
        }

        // --- IMPORT LOGIC ---
        document.getElementById('open-import-btn').addEventListener('click', () => {
            updateDBCounter(); 
            document.getElementById('import-modal').classList.remove('hidden');
        });

        document.getElementById('close-import-btn').addEventListener('click', () => {
            document.getElementById('import-modal').classList.add('hidden');
            document.getElementById('import-status').innerText = "";
        });

        document.getElementById('load-questions-btn').addEventListener('click', () => {
            const input = document.getElementById('import-area').value;
            const status = document.getElementById('import-status');
            
            try {
                const parsed = JSON.parse(input);
                if (Array.isArray(parsed)) {
                    const beforeCount = DB.length;
                    
                    // Add new questions to DB
                    DB = DB.concat(parsed);
                    
                    const afterCount = DB.length;
                    const added = afterCount - beforeCount;
                    
                    status.innerText = `Success! Added ${added} questions.`;
                    status.className = "text-center text-xs font-bold mt-3 h-4 text-emerald-400";
                    
                    updateDBCounter(); 
                    
                    // Clear input
                    document.getElementById('import-area').value = '';
                } else {
                    throw new Error("Not an array");
                }
            } catch (e) {
                status.innerText = "Invalid JSON format.";
                status.className = "text-center text-xs font-bold mt-3 h-4 text-red-400";
            }
        });

        // Start
        initGame();
    </script>

<!-- BLUES APP LOGO -->
<div style="position: fixed; top: 1rem; right: 1rem; z-index: 9999; font-family: sans-serif;">
    <a href="https://blueshub.netlify.app/" style="display: block; width: 200px; opacity: 0.8; transition: opacity 0.2s; background-color: rgba(15, 23, 42, 0.9); backdrop-filter: blur(4px); border-radius: 0.5rem; border: 1px solid #334155; padding: 0.5rem; text-decoration: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">
        <div style="font-size: 0.75rem; text-align: center; color: #94a3b8; margin-bottom: 0.25rem;">Back to Hub</div>
        <img src="logoani.svg" alt="App by Blues" style="width: 100%; height: auto; display: block;">
    </a>
</div>
<!-- END BLUES APP LOGO -->

</body>
</html>
