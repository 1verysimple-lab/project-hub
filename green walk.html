<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tactical Jungle Grid - High Visibility</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --gh-green: #22c55e;
            --gh-home: #3b82f6;
            --gh-target: #ef4444;
            --gh-poi: #f59e0b;
            --bg-dark: #020402;
        }
        body {
            background-color: var(--bg-dark);
            color: #e5e5e5;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
            overflow: hidden;
        }
        .viewport {
            position: relative;
            width: 100%;
            height: 50vh;
            overflow: hidden;
            background: #000;
            border-bottom: 2px solid #1a1a1a;
        }
        #map-canvas {
            position: absolute;
            width: 5000px;
            height: 5000px;
            transform-origin: 0 0;
            background-image: 
                linear-gradient(rgba(34, 197, 94, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34, 197, 94, 0.15) 1px, transparent 1px);
            background-size: 100px 100px; /* Slightly larger grid for label clarity */
        }
        .grid-coord {
            position: absolute;
            font-size: 12px; /* Increased for distance reading */
            font-weight: 900;
            color: rgba(34, 197, 94, 0.7); /* Increased opacity */
            pointer-events: none;
            user-select: none;
            transform: translate(8px, 8px);
            text-shadow: 2px 2px 2px #000, -1px -1px 0 #000; /* Heavy shadow for contrast */
            letter-spacing: -0.5px;
        }
        .marker {
            position: absolute;
            width: 40px;
            height: 40px;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .marker-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 8px rgba(0,0,0,1)); }
        
        .poi-dot {
            position: absolute;
            width: 14px;
            height: 14px;
            background: var(--gh-poi);
            transform: translate(-50%, -50%) rotate(45deg);
            border: 2px solid black;
            z-index: 40;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.8);
            pointer-events: auto;
            cursor: pointer;
        }

        .mode-btn {
            @apply flex-1 py-3 px-1 rounded-xl border-2 border-zinc-800 text-[11px] font-black uppercase transition-all flex flex-col items-center gap-1 bg-zinc-900/40;
        }
        .mode-btn.active.player { border-color: var(--gh-green); color: var(--gh-green); background: rgba(34, 197, 94, 0.2); }
        .mode-btn.active.home { border-color: var(--gh-home); color: var(--gh-home); background: rgba(59, 130, 246, 0.2); }
        .mode-btn.active.target { border-color: var(--gh-target); color: var(--gh-target); background: rgba(239, 68, 68, 0.2); }

        .hud-card {
            @apply bg-zinc-900/90 border border-zinc-700 p-4 rounded-2xl flex flex-col items-center justify-center backdrop-blur-lg;
        }
        .arrow-container { transition: transform 0.5s ease; }
        
        .poi-chip {
            @apply bg-zinc-900 border border-zinc-800 rounded-xl p-3 text-[11px] font-black text-zinc-300 flex justify-between items-center active:bg-zinc-700 active:scale-95 transition-all;
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header -->
    <header class="p-4 bg-black flex justify-between items-center border-b border-zinc-800">
        <div class="text-sm font-black tracking-widest text-zinc-400 uppercase flex items-center gap-2">
            <span class="w-2.5 h-2.5 bg-amber-500 rounded-full shadow-[0_0_10px_rgba(245,158,11,0.5)]"></span>
            STORY_NAV_V3
        </div>
        <div id="live-coords" class="text-xs text-green-500 font-black bg-green-500/10 px-3 py-1 rounded-full border border-green-500/20">--W --S</div>
    </header>

    <!-- Map Viewport -->
    <div class="viewport" id="viewport">
        <div id="map-canvas">
            <div id="poi-layer"></div>
            <div id="marker-layer"></div>
        </div>
        
        <!-- Subtle Crosshair HUD overlay -->
        <div class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-20">
            <div class="w-16 h-16 border-2 border-white/40 rounded-full"></div>
            <div class="absolute w-full h-[1px] bg-white/20"></div>
            <div class="absolute h-full w-[1px] bg-white/20"></div>
        </div>

        <!-- Zoom Controls -->
        <div class="absolute bottom-6 right-6 flex flex-col gap-3 z-50">
            <button onclick="adjustZoom(1.2)" class="w-14 h-14 bg-black/90 rounded-2xl border-2 border-white/20 text-2xl font-black shadow-2xl active:bg-zinc-800">+</button>
            <button onclick="adjustZoom(0.8)" class="w-14 h-14 bg-black/90 rounded-2xl border-2 border-white/20 text-2xl font-black shadow-2xl active:bg-zinc-800">-</button>
        </div>
    </div>

    <!-- Interface -->
    <div class="flex-1 p-5 bg-[#050505] overflow-y-auto space-y-5 pb-16">
        
        <!-- Interaction Toggles -->
        <div class="flex gap-3">
            <button id="btn-player" onclick="setMode('player')" class="mode-btn active player">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>
                Pos
            </button>
            <button id="btn-home" onclick="setMode('home')" class="mode-btn home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </button>
            <button id="btn-target" onclick="setMode('target')" class="mode-btn target">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2"/></svg>
                Goal
            </button>
        </div>

        <!-- Directional HUD -->
        <div class="grid grid-cols-2 gap-4">
            <div class="hud-card border-blue-500/20">
                <span class="text-[10px] font-black text-blue-400 uppercase mb-3 tracking-widest">Home Vector</span>
                <div id="arrow-home" class="arrow-container mb-2">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </div>
                <div id="dist-home" class="text-xs font-black text-white uppercase tracking-tighter">--</div>
            </div>

            <div class="hud-card border-red-500/20">
                <span class="text-[10px] font-black text-red-400 uppercase mb-3 tracking-widest">Goal Vector</span>
                <div id="arrow-target" class="arrow-container mb-2">
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </div>
                <div id="dist-target" class="text-xs font-black text-white uppercase tracking-tighter">--</div>
            </div>
        </div>

        <!-- Story Intel Section -->
        <div class="space-y-3">
            <div class="text-[11px] font-black text-zinc-500 uppercase tracking-[0.2em] px-1 flex items-center justify-between">
                <span>Story Locations</span>
                <span class="text-amber-500 animate-pulse">Select Goal</span>
            </div>
            <div class="grid grid-cols-2 gap-3" id="poi-list">
                <!-- Chips generated by JS -->
            </div>
        </div>

        <!-- Coords Table -->
        <div class="border-2 border-zinc-900 rounded-2xl overflow-hidden text-[10px] font-black">
            <div class="flex justify-between p-3 bg-zinc-900/30 border-b border-zinc-900">
                <span class="text-zinc-500">YOU</span> <span id="txt-player" class="text-green-500">--W --S</span>
            </div>
            <div class="flex justify-between p-3 bg-zinc-900/30 border-b border-zinc-900">
                <span class="text-zinc-500">BASE</span> <span id="txt-home" class="text-blue-500">--W --S</span>
            </div>
            <div class="flex justify-between p-3 bg-zinc-900/30">
                <span class="text-zinc-500">GOAL</span> <span id="txt-target" class="text-red-500">--W --S</span>
            </div>
        </div>
    </div>

    <script>
        const storyPOIs = [
            { name: "Oasis (Start)", w: 46, s: 26 },
            { name: "Drug Lab", w: 51, s: 27 },
            { name: "Jeep / Hook", w: 44, s: 17 },
            { name: "Gold Mine", w: 40, s: 15 },
            { name: "Cocaine Lab", w: 50, s: 27 },
            { name: "Lambda-2", w: 41, s: 27 },
            { name: "Airport", w: 29, s: 22 },
            { name: "Omega Camp", w: 25, s: 33 },
            { name: "Grapple Hook", w: 34, s: 25 },
            { name: "Fishing Dock", w: 51, s: 19 }
        ];

        const state = {
            player: { w: 46, s: 26 },
            home: { w: 46, s: 26 },
            target: null,
            zoom: 0.8,
            pan: { x: -1600, y: -800 },
            mode: 'player'
        };

        const canvas = document.getElementById('map-canvas');
        const viewport = document.getElementById('viewport');
        const markerLayer = document.getElementById('marker-layer');
        const poiLayer = document.getElementById('poi-layer');
        const gridUnit = 100; // Increased spacing for visibility
        const startW = 10;
        const startS = 10;

        const mPlayer = createMarker('marker-player', `<svg class="marker-svg" viewBox="0 0 24 24" fill="#22c55e"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg>`);
        const mHome = createMarker('marker-home', `<svg class="marker-svg" viewBox="0 0 24 24" fill="#3b82f6"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>`);
        const mTarget = createMarker('marker-target', `<svg class="marker-svg" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="4"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="2"/></svg>`);

        function createMarker(cls, svg) {
            const div = document.createElement('div');
            div.className = `marker ${cls}`;
            div.innerHTML = svg;
            markerLayer.appendChild(div);
            return div;
        }

        function init() {
            // Generate full grid coordinate labels with high visibility
            for (let w = 0; w < 60; w++) {
                for (let s = 0; s < 60; s++) {
                    const lbl = document.createElement('div');
                    lbl.className = 'grid-coord';
                    lbl.style.left = (w * gridUnit) + 'px';
                    lbl.style.top = (s * gridUnit) + 'px';
                    lbl.innerText = `${w + startW}W ${s + startS}S`;
                    canvas.appendChild(lbl);
                }
            }

            const poiList = document.getElementById('poi-list');
            storyPOIs.forEach(p => {
                const dot = document.createElement('div');
                dot.className = 'poi-dot';
                dot.style.left = ((p.w - startW) * gridUnit) + 'px';
                dot.style.top = ((p.s - startS) * gridUnit) + 'px';
                dot.title = p.name;
                dot.onclick = (e) => { e.stopPropagation(); setGoal(p.w, p.s); };
                poiLayer.appendChild(dot);

                const chip = document.createElement('button');
                chip.className = 'poi-chip';
                chip.innerHTML = `<span>${p.name}</span> <span class="text-[9px] text-green-500 font-mono ml-2">${p.w}W ${p.s}S</span>`;
                chip.onclick = () => { setGoal(p.w, p.s); centerOn(p.w, p.s); };
                poiList.appendChild(chip);
            });

            viewport.addEventListener('click', (e) => {
                if (isPanning) return;
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / state.zoom;
                const y = (e.clientY - rect.top) / state.zoom;
                const w = Math.round((x / gridUnit) + startW);
                const s = Math.round((y / gridUnit) + startS);
                state[state.mode] = { w, s };
                updateUI();
            });

            viewport.addEventListener('pointermove', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / state.zoom;
                const y = (e.clientY - rect.top) / state.zoom;
                const w = Math.round((x / gridUnit) + startW);
                const s = Math.round((y / gridUnit) + startS);
                document.getElementById('live-coords').innerText = `${w}W ${s}S`;
            });

            updateUI();
            applyTransform();
        }

        function setGoal(w, s) { state.target = { w, s }; updateUI(); }
        function setMode(m) {
            state.mode = m;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${m}`).classList.add('active');
        }
        function adjustZoom(amt) { state.zoom *= amt; state.zoom = Math.min(Math.max(0.1, state.zoom), 4); applyTransform(); }
        function applyTransform() { canvas.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`; }

        function centerOn(w, s) {
            const vWidth = viewport.clientWidth;
            const vHeight = viewport.clientHeight;
            state.pan.x = (vWidth / 2) - ((w - startW) * gridUnit * state.zoom);
            state.pan.y = (vHeight / 2) - ((s - startS) * gridUnit * state.zoom);
            applyTransform();
        }

        function updateUI() {
            const updateMarker = (m, pos) => {
                if (!pos) { m.style.display = 'none'; return; }
                m.style.display = 'block';
                m.style.left = ((pos.w - startW) * gridUnit) + 'px';
                m.style.top = ((pos.s - startS) * gridUnit) + 'px';
            };
            updateMarker(mPlayer, state.player);
            updateMarker(mHome, state.home);
            updateMarker(mTarget, state.target);

            document.getElementById('txt-player').innerText = `${state.player.w}W ${state.player.s}S`;
            document.getElementById('txt-home').innerText = `${state.home.w}W ${state.home.s}S`;
            document.getElementById('txt-target').innerText = state.target ? `${state.target.w}W ${state.target.s}S` : "--W --S";

            const calc = (tar) => {
                if (!tar) return { b: 0, d: 0, str: "WAITING" };
                const dw = tar.w - state.player.w;
                const ds = tar.s - state.player.s;
                let b = Math.atan2(-dw, -ds) * (180 / Math.PI);
                b = (b + 360) % 360;
                const d = Math.sqrt(dw*dw + ds*ds).toFixed(1);
                const cards = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
                const card = cards[Math.round(b / 45) % 8];
                return { b, d, str: `${card} (${d}U)` };
            };

            const h = calc(state.home);
            document.getElementById('arrow-home').style.transform = `rotate(${h.b}deg)`;
            document.getElementById('dist-home').innerText = h.str;

            const t = calc(state.target);
            document.getElementById('arrow-target').style.transform = `rotate(${t.b}deg)`;
            document.getElementById('dist-target').innerText = state.target ? t.str : "STANDBY";
        }

        let isPanning = false;
        let pStartX, pStartY;
        viewport.addEventListener('pointerdown', (e) => {
            isPanning = false;
            pStartX = e.clientX - state.pan.x;
            pStartY = e.clientY - state.pan.y;
            document.addEventListener('pointermove', handlePan);
            document.addEventListener('pointerup', endPan);
        });
        const handlePan = (e) => { isPanning = true; state.pan.x = e.clientX - pStartX; state.pan.y = e.clientY - pStartY; applyTransform(); };
        const endPan = () => { document.removeEventListener('pointermove', handlePan); document.removeEventListener('pointerup', endPan); };

        init();
    </script>
</body>
</html>
